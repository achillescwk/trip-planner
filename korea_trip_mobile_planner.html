<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>South Korea Pre-Trip Timeline Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Color Input Styling */
    input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid #cbd5e1;
      width: 38px;
      height: 38px;
      border-radius: 0.5rem;
      cursor: pointer;
      padding: 2px;
      background: white;
    }
    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 0.375rem;
    }

    
      body.light-mode{background-color:#f8fafc;color:#0f172a;}
      body.dark-mode{background-color:#0f172a;color:#e2e8f0;}
      .dark-mode .bg-white{background:#1e293b !important;}
      .dark-mode .text-slate-900{color:#f1f5f9 !important;}
      .dark-mode .text-slate-800,.dark-mode .text-slate-700,.dark-mode .text-slate-600{color:#cbd5e1 !important;}
      .dark-mode .border-slate-200{border-color:#334155 !important;}
      .dark-mode .bg-slate-50,.dark-mode .bg-slate-50\/70{background:#0f172a !important;}
      .dark-mode input,.dark-mode select,.dark-mode textarea{background:#0f172a !important;color:#f1f5f9 !important;border-color:#475569 !important;}

      
      /* Mobile-first usability enhancements */
      .mobile-fab { display: none; }
      .mobile-section-toggle { display: none; }
      @media (max-width: 1023px) {
        body { padding-bottom: 5.5rem; }
        header > div { padding: 1rem; }
        header h1 { font-size: 1.15rem !important; }
        header p { display: none; }
        header .no-print { width: 100%; overflow-x: auto; flex-wrap: nowrap !important; padding-bottom: .25rem; }
        header .no-print button { flex: 0 0 auto; white-space: nowrap; }
        .mobile-workspace { padding: 1rem !important; gap: 1rem !important; display: flex !important; flex-direction: column; }
        .mobile-main { order: 1; }
        .mobile-sidebar { order: 2; }
        .mobile-filter-bar { position: sticky; top: .5rem; z-index: 20; padding: .75rem !important; }
        .mobile-filter-bar > div:first-child { display: grid !important; grid-template-columns: 1fr 1fr; width: 100%; gap: .5rem !important; }
        .mobile-filter-bar .relative { grid-column: 1 / -1; min-width: 0 !important; }
        .mobile-filter-bar select { width: 100%; min-width: 0; }
        .mobile-filter-bar > div:last-child { width: 100%; justify-content: flex-end; }
        .mobile-sidebar > div { padding: 1rem !important; }
        .mobile-section-toggle { display: inline-flex; align-items: center; justify-content: center; width: 2.25rem; height: 2.25rem; border-radius: .75rem; background: #f1f5f9; color: #334155; font-weight: 800; }
        .dark-mode .mobile-section-toggle { background: #334155; color: #e2e8f0; }
        .mobile-collapsible.collapsed > form,
        .mobile-collapsible.collapsed > #days-list,
        .mobile-collapsible.collapsed > #categories-list { display: none !important; }
        .timeline-card { padding: .875rem !important; }
        .day-section > div:first-child { padding: .85rem 1rem !important; position: sticky; top: 5.75rem; z-index: 10; }
        .day-section > div:last-child { padding: 1rem !important; }
        .mobile-fab { display: flex; position: fixed; right: 1rem; bottom: 1rem; z-index: 40; width: 3.75rem; height: 3.75rem; border-radius: 9999px; align-items: center; justify-content: center; background: #e11d48; color: white; font-size: 2rem; line-height: 1; box-shadow: 0 12px 30px rgba(15,23,42,.35); border: 3px solid rgba(255,255,255,.85); }
        .mobile-fab:active { transform: scale(.96); }
      }

      /* Print Optimizations */
    @media print {
      body {
        background-color: #ffffff;
      }
      .no-print {
        display: none !important;
      }
      .print-full-width {
        grid-column: 1 / -1 !important;
        width: 100% !important;
        max-width: 100% !important;
      }
      .timeline-card {
        break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
      }
      .day-section {
        break-inside: avoid;
        margin-bottom: 2rem !important;
      }
    }
  </style>
</head>
<body class="light-mode min-h-screen flex flex-col">

  <!-- Toast Notification -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none no-print"></div>

  <!-- Confirmation Modal -->
  <div id="confirm-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4 no-print">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-200">
      <h3 id="confirm-title" class="text-lg font-bold text-slate-900 mb-2">Confirm Action</h3>
      <p id="confirm-message" class="text-sm text-slate-600 mb-6">Are you sure you want to proceed?</p>
      <div class="flex justify-end gap-3">
        <button id="confirm-cancel" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition">Cancel</button>
        <button id="confirm-ok" class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 transition">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-slate-900 text-white border-b-4 border-rose-600 shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <div class="flex items-center gap-3">
          <span class="text-3xl">🇰🇷</span>
          <h1 class="text-2xl font-extrabold tracking-tight">South Korea Timeline Planner</h1>
        </div>
        <p class="text-slate-400 text-sm mt-1">Pre-trip chronological itinerary builder for flights, transit, and custom activities.</p>
      </div>
      <div class="flex flex-wrap items-center gap-2.5 no-print">
        <button onclick="toggleTheme()" id="theme-toggle" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 transition flex items-center gap-2 shadow-sm">🌙 Dark Mode</button>
          <button onclick="exportToMarkdown()" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 transition flex items-center gap-2 shadow-sm">
          <span>📋</span> Copy as Markdown / Text
        </button>
        <button onclick="window.print()" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 transition flex items-center gap-2 shadow-sm">
          <span>🖨️</span> Print / Save PDF
        </button>
        <button onclick="promptClearAll()" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-rose-950/60 hover:bg-rose-900 text-rose-200 border border-rose-800/60 transition flex items-center gap-2">
          <span>🗑️</span> Clear All
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="mobile-workspace max-w-7xl w-full mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1 items-start">

    <!-- Left Sidebar: Controls (4 cols on desktop) -->
    <aside class="mobile-sidebar lg:col-span-4 space-y-4 lg:space-y-6 no-print">

      <!-- 1. Add / Edit Timeline Item -->
      <div id="activity-panel" class="mobile-collapsible bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
          <h2 id="activity-form-title" class="text-base font-bold text-slate-900 flex items-center gap-2">
            <span>🗓️</span> Add Timeline Activity
          </h2>
          <button type="button" class="mobile-section-toggle" onclick="toggleMobilePanel('activity-panel', this)" aria-label="Collapse activity form">−</button>
            <button id="cancel-activity-edit" onclick="resetActivityForm()" class="hidden text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg">
            Cancel Edit
          </button>
        </div>

        <form id="activity-form" onsubmit="handleActivitySubmit(event)" class="space-y-4">
          <input type="hidden" id="act-edit-id">

          <div>
            <label for="act-day" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Trip Day *</label>
            <select id="act-day" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"></select>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="act-start" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Start Time *</label>
              <input type="time" id="act-start" required class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
            </div>
            <div>
              <label for="act-end" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">End Time</label>
              <input type="time" id="act-end" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
            </div>
          </div>

          <div>
            <label for="act-title" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Activity / Event Name *</label>
            <input type="text" id="act-title" placeholder="e.g., KE646 Flight to Incheon, KTX to Busan..." required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
          </div>

          <div>
            <label for="act-category" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Category *</label>
            <select id="act-category" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"></select>
          </div>

          <div>
            <label for="act-location" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Location / Route / Terminal</label>
            <input type="text" id="act-location" placeholder="e.g., ICN Terminal 2 → Seoul Station" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
          </div>

          <div>
            <label for="act-notes" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Booking Ref / Pre-Trip Notes</label>
            <textarea id="act-notes" rows="3" placeholder="Confirmation numbers, transfer details, exit numbers, or prep reminders..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"></textarea>
          </div>

          <button type="submit" id="act-submit-btn" class="w-full py-3 px-4 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-semibold text-sm shadow-sm transition flex items-center justify-center gap-2">
            <span>+</span> Add to Timeline
          </button>
        </form>
      </div>

      <!-- 2. Manage Trip Days -->
      <div id="days-panel" class="mobile-collapsible collapsed bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
          <h2 id="day-form-title" class="text-base font-bold text-slate-900 flex items-center gap-2">
            <span>📅</span> Manage Trip Days
          </h2>
          <button type="button" class="mobile-section-toggle" onclick="toggleMobilePanel('days-panel', this)" aria-label="Expand trip days">+</button>
            <button id="cancel-day-edit" onclick="resetDayForm()" class="hidden text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg">
            Cancel
          </button>
        </div>

        <form id="day-form" onsubmit="handleDaySubmit(event)" class="space-y-3 mb-4">
          <input type="hidden" id="day-edit-id">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            <div>
              <label for="day-label" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Day Label *</label>
              <input type="text" id="day-label" placeholder="e.g., Day 1" required class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white">
            </div>
            <div>
              <label for="day-date" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Date (Optional)</label>
              <input type="date" id="day-date" class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white">
            </div>
          </div>
          <div>
            <label for="day-subtitle" class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Day Title / Focus (Optional)</label>
            <input type="text" id="day-subtitle" placeholder="e.g., Arrival in Seoul & Hongdae" class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white">
          </div>
          <button type="submit" id="day-submit-btn" class="w-full py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-semibold text-xs transition">
            + Add Day
          </button>
        </form>

        <div id="days-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
      </div>

      <!-- 3. Manage Categories -->
      <div id="categories-panel" class="mobile-collapsible collapsed bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-100">
          <h2 id="cat-form-title" class="text-base font-bold text-slate-900 flex items-center gap-2">
            <span>🏷️</span> Custom Categories
          </h2>
          <button type="button" class="mobile-section-toggle" onclick="toggleMobilePanel('categories-panel', this)" aria-label="Expand categories">+</button>
            <button id="cancel-cat-edit" onclick="resetCategoryForm()" class="hidden text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg">
            Cancel
          </button>
        </div>

        <form id="category-form" onsubmit="handleCategorySubmit(event)" class="flex gap-2 mb-4">
          <input type="hidden" id="cat-edit-id">
          <input type="text" id="cat-name" placeholder="Category name..." required class="flex-1 px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white">
          <input type="color" id="cat-color" value="#2563eb" title="Pick badge color">
          <button type="submit" id="cat-submit-btn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-semibold text-xs transition shrink-0">
            Add
          </button>
        </form>

        <div id="categories-list" class="flex flex-wrap gap-2"></div>
      </div>

    </aside>

    <!-- Right Main Area: Timeline Filter & Vertical Feed (8 cols on desktop) -->
    <main class="mobile-main lg:col-span-8 print-full-width space-y-4 lg:space-y-6">

      <!-- Filter & Summary Bar -->
      <div class="mobile-filter-bar bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex flex-wrap items-center justify-between gap-4 no-print">
        <div class="flex flex-wrap items-center gap-3 flex-1">
          <div class="relative flex-1 min-w-[180px]">
            <input type="text" id="filter-search" oninput="renderTimeline()" placeholder="🔍 Search flights, places, notes..." class="w-full pl-3.5 pr-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white">
          </div>
          <select id="filter-day" onchange="renderTimeline()" class="px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-600">
            <option value="ALL">All Days</option>
          </select>
          <select id="filter-category" onchange="renderTimeline()" class="px-3.5 py-2 rounded-xl border border-slate-200 bg-slate-50 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-600">
            <option value="ALL">All Categories</option>
          </select>
        </div>

        <div class="flex items-center gap-3">
          <span id="timeline-stats" class="text-xs font-bold uppercase tracking-wider text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg">
            0 Scheduled Items
          </span>
        </div>
      </div>

      <!-- Timeline Container -->
      <div id="timeline-container" class="space-y-8"></div>

    </main>
  </div>

  <script>
    // --- Default State (No pre-populated suggested activities!) ---
    const defaultCategories = [
      { id: 'cat-flights', name: 'Flights', color: '#0284c7' },
      { id: 'cat-transit', name: 'Transit / Traveling', color: '#4f46e5' },
      { id: 'cat-stay', name: 'Accommodation', color: '#7c3aed' },
      { id: 'cat-attractions', name: 'Attractions & Sightseeing', color: '#e11d48' },
      { id: 'cat-food', name: 'Food & Dining', color: '#d97706' },
      { id: 'cat-shopping', name: 'Shopping', color: '#059669' }
    ];

    const defaultDays = [
      { id: 'day-1', label: 'Day 1', date: '', subtitle: '' }
    ];

    // Load from LocalStorage or fall back to empty activities list
    let categories = JSON.parse(localStorage.getItem('kr_timeline_categories')) || defaultCategories;
    let days = JSON.parse(localStorage.getItem('kr_timeline_days')) || defaultDays;
    let activities = JSON.parse(localStorage.getItem('kr_timeline_activities')) || [];

    function saveData() {
      localStorage.setItem('kr_timeline_categories', JSON.stringify(categories));
      localStorage.setItem('kr_timeline_days', JSON.stringify(days));
      localStorage.setItem('kr_timeline_activities', JSON.stringify(activities));
    }

    
const savedTheme = localStorage.getItem('kr_theme') || 'light';
function applyTheme(theme){document.body.classList.remove('light-mode','dark-mode');document.body.classList.add(theme+'-mode');const btn=document.getElementById('theme-toggle');if(btn){btn.innerHTML=theme==='dark'?'☀️ Light Mode':'🌙 Dark Mode';}localStorage.setItem('kr_theme',theme);}
function toggleTheme(){const isDark=document.body.classList.contains('dark-mode');applyTheme(isDark?'light':'dark');}
function suggestNextStartTime(dayId){const dayActivities=activities.filter(a=>a.dayId===dayId&&a.endTime).sort((a,b)=>(a.endTime||'').localeCompare(b.endTime||''));if(dayActivities.length===0) return '';return dayActivities[dayActivities.length-1].endTime;}
// --- Toast Notification Helper ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bg = type === 'error' ? 'bg-rose-600' : 'bg-slate-900';
      toast.className = `${bg} text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-lg border border-white/10 flex items-center gap-2 transition-all duration-300 pointer-events-auto`;
      toast.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span> <span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    // --- Custom Confirm Modal Helper ---
    function showConfirm(title, message, onConfirm) {
      const modal = document.getElementById('confirm-modal');
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const cancelBtn = document.getElementById('confirm-cancel');
      const okBtn = document.getElementById('confirm-ok');

      const cleanup = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        cancelBtn.onclick = null;
        okBtn.onclick = null;
      };

      cancelBtn.onclick = cleanup;
      okBtn.onclick = () => {
        cleanup();
        onConfirm();
      };
    }

    // --- Initialization ---
    function init() {
      renderDaysUI();
      renderCategoriesUI();
      renderTimeline();
    }

    // --- Days Management ---
    function renderDaysUI() {
      const actDaySelect = document.getElementById('act-day');
      const filterDaySelect = document.getElementById('filter-day');
      const daysList = document.getElementById('days-list');

      const prevActDay = actDaySelect.value;
      const prevFilterDay = filterDaySelect.value || 'ALL';

      actDaySelect.innerHTML = '';
      filterDaySelect.innerHTML = '<option value="ALL">All Days</option>';
      daysList.innerHTML = '';

      days.forEach((day, index) => {
        const displayTitle = formatDayHeader(day);

        // Activity form select
        const opt1 = document.createElement('option');
        opt1.value = day.id;
        opt1.textContent = displayTitle;
        actDaySelect.appendChild(opt1);

        // Filter select
        const opt2 = document.createElement('option');
        opt2.value = day.id;
        opt2.textContent = displayTitle;
        filterDaySelect.appendChild(opt2);

        // Sidebar list item
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-xs';
        item.innerHTML = `
          <div class="truncate">
            <span class="font-bold text-slate-800">${escapeHtml(day.label)}</span>
            ${day.date ? `<span class="text-slate-500 ml-1">(${escapeHtml(day.date)})</span>` : ''}
            ${day.subtitle ? `<p class="text-slate-500 truncate mt-0.5">${escapeHtml(day.subtitle)}</p>` : ''}
          </div>
          <div class="flex items-center gap-1 shrink-0">
            ${index > 0 ? `<button onclick="moveDay(${index}, -1)" title="Move Up" class="p-1 hover:bg-slate-200 rounded text-slate-500">↑</button>` : ''}
            ${index < days.length - 1 ? `<button onclick="moveDay(${index}, 1)" title="Move Down" class="p-1 hover:bg-slate-200 rounded text-slate-500">↓</button>` : ''}
            <button onclick="editDay('${day.id}')" title="Edit Day" class="p-1 hover:bg-slate-200 rounded text-slate-600">✏️</button>
            <button onclick="deleteDay('${day.id}')" title="Delete Day" class="p-1 hover:bg-rose-100 rounded text-rose-600">🗑️</button>
          </div>
        `;
        daysList.appendChild(item);
      });

      if (prevActDay && days.some(d => d.id === prevActDay)) {
        actDaySelect.value = prevActDay;
      }
      if (prevFilterDay === 'ALL' || days.some(d => d.id === prevFilterDay)) {
        filterDaySelect.value = prevFilterDay;
      }

      // Suggest next day number in placeholder
      if (!document.getElementById('day-edit-id').value) {
        document.getElementById('day-label').placeholder = `e.g., Day ${days.length + 1}`;
      }
    }

    function formatDayHeader(day) {
      let parts = [day.label];
      if (day.date) parts.push(`• ${day.date}`);
      if (day.subtitle) parts.push(`— ${day.subtitle}`);
      return parts.join(' ');
    }

    function handleDaySubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('day-edit-id').value;
      const label = document.getElementById('day-label').value.trim();
      const date = document.getElementById('day-date').value;
      const subtitle = document.getElementById('day-subtitle').value.trim();

      if (!label) return;

      if (editId) {
        const idx = days.findIndex(d => d.id === editId);
        if (idx > -1) {
          days[idx] = { id: editId, label, date, subtitle };
          showToast(`Updated ${label}`);
        }
      } else {
        const newDay = {
          id: 'day-' + Date.now(),
          label,
          date,
          subtitle
        };
        days.push(newDay);
        showToast(`Added ${label}`);
      }

      saveData();
      resetDayForm();
      renderDaysUI();
      renderTimeline();
    }

    function editDay(id) {
      const day = days.find(d => d.id === id);
      if (!day) return;
      document.getElementById('day-edit-id').value = day.id;
      document.getElementById('day-label').value = day.label;
      document.getElementById('day-date').value = day.date || '';
      document.getElementById('day-subtitle').value = day.subtitle || '';

      document.getElementById('day-form-title').innerHTML = '<span>✏️</span> Edit Trip Day';
      document.getElementById('day-submit-btn').textContent = 'Save Day Changes';
      document.getElementById('cancel-day-edit').classList.remove('hidden');
    }

    function resetDayForm() {
      document.getElementById('day-form').reset();
      document.getElementById('day-edit-id').value = '';
      document.getElementById('day-form-title').innerHTML = '<span>📅</span> Manage Trip Days';
      document.getElementById('day-submit-btn').textContent = '+ Add Day';
      document.getElementById('cancel-day-edit').classList.add('hidden');
      document.getElementById('day-label').placeholder = `e.g., Day ${days.length + 1}`;
    }

    function moveDay(index, direction) {
      const target = index + direction;
      if (target < 0 || target >= days.length) return;
      const temp = days[index];
      days[index] = days[target];
      days[target] = temp;
      saveData();
      renderDaysUI();
      renderTimeline();
    }

    function deleteDay(id) {
      if (days.length <= 1) {
        showToast('Your trip must have at least one day.', 'error');
        return;
      }
      const count = activities.filter(a => a.dayId === id).length;
      const msg = count > 0
        ? `This day has ${count} scheduled item(s). Deleting it will also remove those items from your timeline. Continue?`
        : 'Are you sure you want to delete this day?';

      showConfirm('Delete Trip Day', msg, () => {
        days = days.filter(d => d.id !== id);
        activities = activities.filter(a => a.dayId !== id);
        saveData();
        renderDaysUI();
        renderTimeline();
        showToast('Day deleted');
      });
    }

    // --- Categories Management ---
    function renderCategoriesUI() {
      const actCatSelect = document.getElementById('act-category');
      const filterCatSelect = document.getElementById('filter-category');
      const catList = document.getElementById('categories-list');

      const prevActCat = actCatSelect.value;
      const prevFilterCat = filterCatSelect.value || 'ALL';

      actCatSelect.innerHTML = '';
      filterCatSelect.innerHTML = '<option value="ALL">All Categories</option>';
      catList.innerHTML = '';

      categories.forEach(cat => {
        const opt1 = document.createElement('option');
        opt1.value = cat.id;
        opt1.textContent = cat.name;
        actCatSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = cat.id;
        opt2.textContent = cat.name;
        filterCatSelect.appendChild(opt2);

        const badge = document.createElement('div');
        badge.className = 'inline-flex items-center gap-1.5 pl-3 pr-2 py-1 rounded-full text-xs font-semibold text-white shadow-sm';
        badge.style.backgroundColor = cat.color;
        badge.innerHTML = `
          <span>${escapeHtml(cat.name)}</span>
          <button onclick="editCategory('${cat.id}')" title="Edit category" class="hover:bg-black/20 rounded-full p-0.5 leading-none">✏️</button>
          <button onclick="deleteCategory('${cat.id}')" title="Delete category" class="hover:bg-black/20 rounded-full px-1 leading-none">&times;</button>
        `;
        catList.appendChild(badge);
      });

      if (prevActCat && categories.some(c => c.id === prevActCat)) {
        actCatSelect.value = prevActCat;
      }
      if (prevFilterCat === 'ALL' || categories.some(c => c.id === prevFilterCat)) {
        filterCatSelect.value = prevFilterCat;
      }
    }

    function handleCategorySubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('cat-edit-id').value;
      const name = document.getElementById('cat-name').value.trim();
      const color = document.getElementById('cat-color').value;

      if (!name) return;

      if (editId) {
        const idx = categories.findIndex(c => c.id === editId);
        if (idx > -1) {
          categories[idx] = { id: editId, name, color };
          showToast(`Updated category "${name}"`);
        }
      } else {
        const newCat = {
          id: 'cat-' + Date.now(),
          name,
          color
        };
        categories.push(newCat);
        showToast(`Added category "${name}"`);
      }

      saveData();
      resetCategoryForm();
      renderCategoriesUI();
      renderTimeline();
    }

    function editCategory(id) {
      const cat = categories.find(c => c.id === id);
      if (!cat) return;
      document.getElementById('cat-edit-id').value = cat.id;
      document.getElementById('cat-name').value = cat.name;
      document.getElementById('cat-color').value = cat.color;

      document.getElementById('cat-form-title').innerHTML = '<span>✏️</span> Edit Category';
      document.getElementById('cat-submit-btn').textContent = 'Save';
      document.getElementById('cancel-cat-edit').classList.remove('hidden');
    }

    function resetCategoryForm() {
      document.getElementById('category-form').reset();
      document.getElementById('cat-edit-id').value = '';
      document.getElementById('cat-color').value = '#2563eb';
      document.getElementById('cat-form-title').innerHTML = '<span>🏷️</span> Custom Categories';
      document.getElementById('cat-submit-btn').textContent = 'Add';
      document.getElementById('cancel-cat-edit').classList.add('hidden');
    }

    function deleteCategory(id) {
      if (categories.length <= 1) {
        showToast('You need at least one category.', 'error');
        return;
      }
      const inUse = activities.some(a => a.categoryId === id);
      const proceed = () => {
        categories = categories.filter(c => c.id !== id);
        const fallbackId = categories[0].id;
        activities.forEach(a => {
          if (a.categoryId === id) a.categoryId = fallbackId;
        });
        saveData();
        renderCategoriesUI();
        renderTimeline();
        showToast('Category removed');
      };

      if (inUse) {
        showConfirm(
          'Delete Category in Use',
          `Some timeline items use this category. Deleting it will reassign those items to "${categories.find(c => c.id !== id).name}". Continue?`,
          proceed
        );
      } else {
        proceed();
      }
    }

    // --- Timeline Activity Management ---
    function handleActivitySubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('act-edit-id').value;
      const dayId = document.getElementById('act-day').value;
      const startTime = document.getElementById('act-start').value;
      const endTime = document.getElementById('act-end').value;
      const title = document.getElementById('act-title').value.trim();
      const categoryId = document.getElementById('act-category').value;
      const location = document.getElementById('act-location').value.trim();
      const notes = document.getElementById('act-notes').value.trim();

      if (!title || !dayId || !startTime) return;

      if (editId) {
        const idx = activities.findIndex(a => a.id === editId);
        if (idx > -1) {
          activities[idx] = { id: editId, dayId, startTime, endTime, title, categoryId, location, notes };
          showToast('Timeline item updated');
        }
      } else {
        activities.push({
          id: 'act-' + Date.now(),
          dayId,
          startTime,
          endTime,
          title,
          categoryId,
          location,
          notes
        });
        showToast('Added to timeline');
      }

      saveData();
      // Preserve selected day for fast sequential entry
      const currentDay = document.getElementById('act-day').value;
      resetActivityForm();
      document.getElementById('act-day').value = currentDay;
      renderTimeline();
    }

    function editActivity(id) {
      const act = activities.find(a => a.id === id);
      if (!act) return;

      document.getElementById('act-edit-id').value = act.id;
      document.getElementById('act-day').value = act.dayId;
      document.getElementById('act-start').value = act.startTime;
      document.getElementById('act-end').value = act.endTime || '';
      document.getElementById('act-title').value = act.title;
      document.getElementById('act-category').value = act.categoryId;
      document.getElementById('act-location').value = act.location || '';
      document.getElementById('act-notes').value = act.notes || '';

      document.getElementById('activity-form-title').innerHTML = '<span>✏️</span> Edit Timeline Activity';
      document.getElementById('act-submit-btn').textContent = 'Save Activity Changes';
      document.getElementById('cancel-activity-edit').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetActivityForm() {
      document.getElementById('activity-form').reset();
      document.getElementById('act-edit-id').value = '';
      document.getElementById('activity-form-title').innerHTML = '<span>🗓️</span> Add Timeline Activity';
      document.getElementById('act-submit-btn').innerHTML = '<span>+</span> Add to Timeline';
      document.getElementById('cancel-activity-edit').classList.add('hidden');
    }

    function deleteActivity(id) {
      activities = activities.filter(a => a.id !== id);
      saveData();
      renderTimeline();
      showToast('Item removed from timeline');
    }

    function quickAddForDay(dayId) {
      resetActivityForm();
      document.getElementById('act-day').value = dayId;
      document.getElementById('act-start').focus();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- Render Vertical Chronological Timeline ---
    function renderTimeline() {
      const container = document.getElementById('timeline-container');
      const search = document.getElementById('filter-search').value.toLowerCase().trim();
      const dayFilter = document.getElementById('filter-day').value;
      const catFilter = document.getElementById('filter-category').value;

      // Filter activities
      const filteredActivities = activities.filter(act => {
        const matchesDay = dayFilter === 'ALL' || act.dayId === dayFilter;
        const matchesCat = catFilter === 'ALL' || act.categoryId === catFilter;
        const matchesSearch = !search ||
          act.title.toLowerCase().includes(search) ||
          (act.location && act.location.toLowerCase().includes(search)) ||
          (act.notes && act.notes.toLowerCase().includes(search));
        return matchesDay && matchesCat && matchesSearch;
      });

      document.getElementById('timeline-stats').textContent =
        `${filteredActivities.length} ${filteredActivities.length === 1 ? 'Scheduled Item' : 'Scheduled Items'}`;

      // If completely empty state (no activities added yet)
      if (activities.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border-2 border-dashed border-slate-300 p-12 text-center">
            <div class="w-14 h-14 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-2xl mx-auto mb-4">
              ✈️
            </div>
            <h3 class="text-lg font-bold text-slate-900">Your Korea Itinerary Timeline is Empty</h3>
            <p class="text-sm text-slate-500 max-w-md mx-auto mt-1 mb-6">
              Start building your custom chronological schedule using the form on the left. Add your flights, airport transit, hotel check-ins, and attractions!
            </p>
            <div class="inline-flex flex-wrap justify-center gap-2 text-xs text-slate-500">
              <span class="px-3 py-1.5 rounded-lg bg-slate-100 font-medium">1. Add Trip Days</span>
              <span>→</span>
              <span class="px-3 py-1.5 rounded-lg bg-slate-100 font-medium">2. Customize Categories</span>
              <span>→</span>
              <span class="px-3 py-1.5 rounded-lg bg-slate-100 font-medium">3. Add Time-Slotted Activities</span>
            </div>
          </div>
        `;
        return;
      }

      // If activities exist, but filter returned 0
      if (filteredActivities.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center">
            <h3 class="text-base font-bold text-slate-800">No timeline items match your filter</h3>
            <p class="text-sm text-slate-500 mt-1">Try clearing your search keyword or switching Day/Category filters back to "All".</p>
          </div>
        `;
        return;
      }

      // Group by Day in trip order
      const visibleDays = days.filter(d => dayFilter === 'ALL' || d.id === dayFilter);

      container.innerHTML = visibleDays.map(day => {
        const dayActs = filteredActivities
          .filter(a => a.dayId === day.id)
          .sort((a, b) => (a.startTime || '99:99').localeCompare(b.startTime || '99:99'));

        // When filtering by search or category, hide days that have no matching activities
        if (dayActs.length === 0 && (search || catFilter !== 'ALL')) {
          return '';
        }

        return `
          <section class="day-section bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <!-- Day Banner -->
            <div class="bg-slate-900 text-white px-6 py-4 flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-baseline gap-2.5">
                <h2 class="text-lg font-extrabold tracking-tight">${escapeHtml(day.label)}</h2>
                ${day.date ? `<span class="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300">${escapeHtml(day.date)}</span>` : ''}
                ${day.subtitle ? `<span class="text-sm font-medium text-rose-400">— ${escapeHtml(day.subtitle)}</span>` : ''}
              </div>
              <button onclick="quickAddForDay('${day.id}')" class="no-print text-xs font-semibold bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg transition">
                + Add Item to ${escapeHtml(day.label)}
              </button>
            </div>

            <!-- Day Timeline Feed -->
            <div class="p-6">
              ${dayActs.length === 0 ? `
                <div class="text-center py-6 text-sm text-slate-400 italic">
                  No activities scheduled for ${escapeHtml(day.label)} yet.
                </div>
              ` : `
                <div class="relative pl-6 sm:pl-8 border-l-2 border-slate-200 space-y-6 ml-2 sm:ml-4">
                  ${dayActs.map(act => {
                    const cat = categories.find(c => c.id === act.categoryId) || { name: 'Uncategorized', color: '#64748b' };
                    return `
                      <div class="relative group timeline-card bg-slate-50/70 hover:bg-white rounded-2xl border border-slate-200/90 p-4 sm:p-5 transition shadow-sm">
                        <!-- Timeline Dot on Vertical Bar -->
                        <span class="absolute -left-[33px] sm:-left-[41px] top-6 w-4 h-4 rounded-full border-4 border-white shadow" style="background-color: ${cat.color}"></span>

                        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                          <div class="space-y-1.5 flex-1">
                            <!-- Time & Category Row -->
                            <div class="flex flex-wrap items-center gap-2">
                              <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-900 text-white text-xs font-bold tracking-wide">
                                🕒 ${formatTimeRange(act.startTime, act.endTime)}
                              </span>
                              <span class="px-2.5 py-1 rounded-full text-xs font-bold text-white" style="background-color: ${cat.color}">
                                ${escapeHtml(cat.name)}
                              </span>
                              ${act.location ? `
                                <span class="inline-flex items-center gap-1 text-xs font-semibold text-slate-600 bg-slate-200/70 px-2.5 py-1 rounded-lg">
                                  📍 ${escapeHtml(act.location)}
                                </span>
                              ` : ''}
                            </div>

                            <!-- Activity Title -->
                            <h3 class="text-base font-bold text-slate-900 pt-1">${escapeHtml(act.title)}</h3>

                            <!-- Notes -->
                            ${act.notes ? `
                              <p class="text-sm text-slate-600 whitespace-pre-line pt-1 leading-relaxed">${escapeHtml(act.notes)}</p>
                            ` : ''}
                          </div>

                          <!-- Edit / Delete Actions -->
                          <div class="flex items-center gap-1.5 self-end sm:self-start shrink-0 no-print">
                            <button onclick="editActivity('${act.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 transition">
                              ✏️ Edit
                            </button>
                            <button onclick="deleteActivity('${act.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-white hover:bg-rose-50 text-rose-600 border border-slate-200 transition">
                              🗑️
                            </button>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          </section>
        `;
      }).join('');
    }

    function formatTimeRange(start, end) {
      if (!start) return 'TBD';
      return end ? `${start} – ${end}` : start;
    }

    // --- Export to Markdown / Text (Clipboard Fallback for iFrame compatibility) ---
    function exportToMarkdown() {
      if (activities.length === 0) {
        showToast('Your timeline is empty — add activities first!', 'error');
        return;
      }

      let md = `# 🇰🇷 South Korea Trip Timeline Itinerary\n\n`;

      days.forEach(day => {
        const dayActs = activities
          .filter(a => a.dayId === day.id)
          .sort((a, b) => (a.startTime || '99:99').localeCompare(b.startTime || '99:99'));

        if (dayActs.length > 0) {
          md += `## ${formatDayHeader(day)}\n`;
          dayActs.forEach(act => {
            const cat = categories.find(c => c.id === act.categoryId) || { name: 'Activity' };
            const timeStr = formatTimeRange(act.startTime, act.endTime);
            const locStr = act.location ? ` | 📍 ${act.location}` : '';
            md += `- **${timeStr}** — **[${cat.name}] ${act.title}**${locStr}\n`;
            if (act.notes) {
              md += `  *Notes: ${act.notes.replace(/\n/g, ' ')}*\n`;
            }
          });
          md += `\n`;
        }
      });

      const tempTextArea = document.createElement('textarea');
      tempTextArea.value = md;
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      try {
        document.execCommand('copy');
        showToast('Copied formatted timeline to clipboard! Paste into Notion, Notes, or Docs.');
      } catch (err) {
        showToast('Could not copy automatically.', 'error');
      }
      document.body.removeChild(tempTextArea);
    }

    // --- Clear All Data ---
    function promptClearAll() {
      showConfirm(
        'Clear Entire Timeline?',
        'This will remove all your scheduled timeline activities and reset days and categories back to default.',
        () => {
          localStorage.removeItem('kr_timeline_categories');
          localStorage.removeItem('kr_timeline_days');
          localStorage.removeItem('kr_timeline_activities');
          categories = JSON.parse(JSON.stringify(defaultCategories));
          days = JSON.parse(JSON.stringify(defaultDays));
          activities = [];
          resetActivityForm();
          resetDayForm();
          resetCategoryForm();
          
      function toggleMobilePanel(panelId, button) {
        const panel = document.getElementById(panelId);
        if (!panel) return;
        panel.classList.toggle('collapsed');
        const collapsed = panel.classList.contains('collapsed');
        button.textContent = collapsed ? '+' : '−';
        button.setAttribute('aria-label', collapsed ? 'Expand section' : 'Collapse section');
      }
      function openMobileAdd() {
        const panel = document.getElementById('activity-panel');
        if (panel) {
          panel.classList.remove('collapsed');
          const toggle = panel.querySelector('.mobile-section-toggle');
          if (toggle) toggle.textContent = '−';
          panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
          setTimeout(() => document.getElementById('act-title').focus(), 350);
        }
      }

      document.getElementById('act-day').addEventListener('change',function(){if(document.getElementById('act-edit-id').value) return; const nextTime=suggestNextStartTime(this.value); if(nextTime){document.getElementById('act-start').value=nextTime;}});
      init();
          showToast('Timeline cleared');
        }
      );
    }

    // --- XSS Protection Helper ---
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.getElementById('act-day').addEventListener('change',function(){if(document.getElementById('act-edit-id').value) return; const nextTime=suggestNextStartTime(this.value); if(nextTime){document.getElementById('act-start').value=nextTime;}});
      init();
  </script>
</body>
</html>
